<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA-EDUCA+</title>
    <link rel="stylesheet" href="./cadastro-novo-aluno.css">
</head>

<body>
    <section>
        <h1>Novo Cadastro</h1>
        <form  id="formCadastroAluno" action="">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required minlength="4" maxlength="80"
                placeholder="Digite seu nome completo ">

            <label for="genero">Gênero:</label>
            <select name="genero" id="genero" required>
                <option value="" selected>Selecione...</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="lgbt">LGBT</option>
                <option value="outro">Outro</option>
            </select>
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <label for="cpf">CPF:</label>
            <input type="number" id="cpf" name="cpf" required placeholder="Digite seu CPF">
            <label for="fone">Telefone:</label>
            <input type="number" id="fone" name="fone" required placeholder="Digite seu telefone">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu E-mail">
            <section id="endereço">
                <label for="cep">CEP:</label>
                <input type="number" id="cep" name="cep" required placeholder="Digite seu Cep">
                <label for="logradouro">Logradouro:</label>
                <input type="text" id="logradouro" name="logradouro" required placeholder="Digite seu logradouro(Rua...)">
                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" required placeholder="Digite aqui o número ">
                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" name="complemento" placeholder="Digite o complemento">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required placeholder="Digite seu Bairro">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required placeholder="Digite aqui sua cidade">
                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado" required placeholder="Digite seu estado">
            
            </section>
            <button type="submit">SALVAR</button>
        </form>
    </section>
    <script type="module" src="../cadastro-novo-aluno/cadastro-novo-aluno.js" defer></script>
</body>

</html>
